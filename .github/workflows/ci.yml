name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Reads the color tokens from app/globals.css: text pairs at 4.5:1, input borders at 3:1, and
      # the two light-theme blocks must match. No build needed.
      - run: npm run check:contrast

      # NEXT_PUBLIC_* values are shipped to the browser anyway (not secrets) - these are
      # placeholders good enough for a production build (Next.js doesn't call Supabase at
      # build time, cookies()-based routes are rendered dynamically at request time, not
      # prerendered), so no repo secrets need to be configured just to run CI.
      #
      # SENTRY_AUTH_TOKEN is a real credential, unlike the two above - it must come from a
      # GitHub Actions repository secret (Settings > Secrets and variables > Actions > New
      # repository secret), never hardcoded here. If it's unset, next.config.ts's
      # withSentryConfig() just skips source map upload for that build - it doesn't fail CI.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Client JavaScript (gzip) must stay under the budget in scripts/check-bundle-size.mjs.
      - run: npm run check:bundle

      # Accessibility smoke test: axe (WCAG A/AA) on the signed-out screens in both themes at desktop
      # and phone width, against the production build above. Needs only the placeholder env vars
      # that playwright.config.ts supplies, so no secrets are involved.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:a11y

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
